spring:
  application:
    name: fila-certa-sus

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/filacerta}
    username: ${DB_USERNAME:filacerta}
    password: ${DB_PASSWORD:filacerta}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
